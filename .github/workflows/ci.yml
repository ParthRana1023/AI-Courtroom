name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Server tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # mongomock: fast, in-memory. mongodb: the same tests against a real
        # server through PyMongo's async client, as in production (catches driver mismatches).
        database: [mongomock, mongodb]
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_MONGODB_URL: ${{ matrix.database == 'mongodb' && 'mongodb://localhost:27017' || '' }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13" # matches server/Dockerfile
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      # sentence-transformers otherwise pulls the CUDA build of PyTorch (~2 GB).
      - name: Install CPU-only PyTorch
        run: pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Lint once; the result doesn't depend on the database leg. pyrefly needs
      # the installed dependencies, so it runs here rather than in its own job.
      - name: Lint, format and type check
        if: matrix.database == 'mongomock'
        run: |
          python -m ruff check .
          python -m black --check .
          pyrefly check

      # Tests use a fake LLM and fake embeddings and block third-party APIs
      # (see tests/conftest.py), so no secrets are needed here.
      # Coverage is at 100%; the bar leaves a little room.
      - name: Run pytest with coverage
        run: python -m pytest -q --cov --cov-report=term --cov-fail-under=97

  client-typecheck:
    name: Client type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

  client-e2e:
    name: Client e2e (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      # The config builds the app against a mocked API origin, then runs every project.
      # @visual tests are skipped in CI until Linux baselines are committed.
      - name: Run Playwright
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/e2e/.report
          retention-days: 7
